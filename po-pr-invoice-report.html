<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO · PR · Invoice Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --blue:#2563eb;--blue-l:#eff6ff;--blue-d:#1d4ed8;
  --green:#16a34a;--green-l:#f0fdf4;
  --red:#dc2626;--red-l:#fef2f2;
  --amber:#d97706;--amber-l:#fffbeb;
  --purple:#7c3aed;--purple-l:#f5f3ff;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;
  --g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;
  --g700:#374151;--g900:#111827;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:var(--g900);background:var(--g50);overflow-x:hidden}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.hdr p{font-size:11px;opacity:.75;margin-top:2px}
.hdr-right{margin-left:auto;display:flex;gap:8px}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--g200);padding:0 20px;gap:2px;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab-btn{padding:10px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--g500);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--blue)}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-count{background:var(--g100);color:var(--g500);font-size:10px;padding:1px 7px;border-radius:99px;transition:all .2s}
.tab-btn.active .tab-count{background:var(--blue-l);color:var(--blue)}
.tab-content{display:none}
.tab-content.active{display:block}

/* TOOLBAR */
.toolbar{background:#fff;padding:9px 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--g200);flex-wrap:wrap;position:sticky;top:47px;z-index:40}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:460px}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--g400);pointer-events:none}
.search-input{width:100%;padding:7px 10px 7px 32px;border:1.5px solid var(--g200);border-radius:7px;font-size:13px;outline:none;transition:border .15s;background:var(--g50)}
.search-input:focus{border-color:var(--blue);background:#fff}
.hint{font-size:11px;color:var(--g400)}

/* BUTTONS */
.btn{padding:6px 13px;border:1.5px solid var(--g200);border-radius:7px;background:#fff;cursor:pointer;font-size:12px;font-weight:500;color:var(--g700);display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--g50);border-color:var(--g300)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-active{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red-l)}

/* TABLE */
.tbl-wrap{overflow:auto;position:relative}
table{width:100%;border-collapse:collapse;min-width:700px;table-layout:fixed}
thead{position:sticky;top:0;z-index:20;background:#fff}
thead th{background:#fff;border-bottom:2px solid var(--g200);padding:9px 10px;font-size:12px;font-weight:600;color:var(--g700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;user-select:none;cursor:default}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{background:var(--g50)}
thead th.sort-asc::after{content:' ▲';font-size:9px;color:var(--blue)}
thead th.sort-desc::after{content:' ▼';font-size:9px;color:var(--blue)}
tbody tr{border-bottom:1px solid var(--g100);transition:background .1s;cursor:pointer}
tbody tr:hover{background:#f0f9ff}
tbody tr.selected{background:#dbeafe;border-left:3px solid var(--blue)}
tbody tr.alt{background:var(--g50)}
tbody td{padding:8px 10px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-shadow thead th{box-shadow:0 2px 4px rgba(0,0,0,.08)}

/* RESIZE HANDLE */
.resize-handle{position:absolute;right:0;top:0;width:5px;height:100%;cursor:col-resize;z-index:5}
.resize-handle:hover,.resize-handle.active{background:var(--blue);opacity:.5}

/* COLUMN SORT ▼ ICON */
.col-menu-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--g400);cursor:pointer;padding:2px;border-radius:3px;background:transparent;border:none;line-height:1;opacity:0;transition:opacity .15s}
th:hover .col-menu-btn{opacity:1}
th.has-popup-filter .col-menu-btn{opacity:1;color:var(--blue)}
th.has-popup-filter{color:var(--blue)}

/* POPUP FILTER */
.popup-filter{position:fixed;z-index:9000;background:#fff;border:1px solid var(--g200);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px;min-width:220px;max-width:300px}
.popup-filter input[type=text]{width:100%;padding:5px 8px;border:1px solid var(--g200);border-radius:5px;font-size:12px;margin-bottom:8px;outline:none}
.popup-filter input[type=text]:focus{border-color:var(--blue)}
.popup-filter-list{max-height:180px;overflow-y:auto;font-size:12px;margin-bottom:8px}
.popup-filter-list label{display:flex;align-items:center;gap:6px;padding:3px 2px;cursor:pointer;border-radius:3px}
.popup-filter-list label:hover{background:var(--g50)}
.popup-filter-row{display:flex;gap:6px;margin-bottom:8px}
.popup-sort-btn{flex:1;padding:5px;border:1px solid var(--g200);border-radius:5px;background:#fff;cursor:pointer;font-size:11px;color:var(--g700)}
.popup-sort-btn:hover{background:var(--blue-l);color:var(--blue)}
.popup-filter-actions{display:flex;gap:6px;align-items:center;font-size:11px}
.popup-link{color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:11px}

/* COL FILTER ROW */
.filter-row th{background:var(--g50);padding:3px 4px;border-bottom:1px solid var(--g200)}
.filter-row input{width:100%;padding:3px 6px;border:1px solid var(--g200);border-radius:4px;font-size:11px;outline:none;background:#fff}
.filter-row input:focus{border-color:var(--blue)}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:#dcfce7;color:#15803d}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#6d28d9}
.badge-gray{background:var(--g100);color:var(--g500)}

/* LINK TEXT */
.link-text{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:500}
.link-text:hover{text-decoration:underline}

/* PAGINATION */
.pager{display:flex;align-items:center;gap:6px;padding:10px 18px;background:#fff;border-top:1px solid var(--g200);flex-wrap:wrap}
.pager .info{font-size:12px;color:var(--g500);margin-right:auto}
.page-btn{width:30px;height:30px;border:1.5px solid var(--g200);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--g700);transition:all .12s}
.page-btn:hover{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.page-btn:disabled{opacity:.35;cursor:default}
select.page-size{padding:4px 8px;border:1.5px solid var(--g200);border-radius:6px;font-size:12px;cursor:pointer;background:#fff;outline:none}

/* SKELETON */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:600px 100%;animation:shimmer 1.4s infinite;border-radius:4px;height:14px}
.skel-row td{padding:10px 12px}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;z-index:200;pointer-events:none;display:flex;align-items:flex-end}
.drawer-overlay.open{pointer-events:all}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.drawer-overlay.open .drawer-bg{opacity:1}
.drawer{position:relative;width:100%;max-height:75vh;background:#fff;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
.drawer-overlay.open .drawer{transform:translateY(0)}
.drawer-hdr{padding:14px 20px 10px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:10px;flex-shrink:0;background:#fff}
.drawer-hdr h3{font-size:15px;font-weight:700;flex:1}
.drawer-body{overflow-y:auto;padding:14px 20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.drawer-section h4{font-size:12px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.drawer-mini-tbl{width:100%;border-collapse:collapse;font-size:12px}
.drawer-mini-tbl th{background:var(--g50);padding:6px 8px;font-weight:600;color:var(--g700);border-bottom:1px solid var(--g200);text-align:left;white-space:nowrap}
.drawer-mini-tbl td{padding:6px 8px;border-bottom:1px solid var(--g100);white-space:nowrap}
.drawer-mini-tbl tr:last-child td{border-bottom:none}
.drawer-mini-tbl tr:hover td{background:var(--g50)}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:slideIn .25s ease;pointer-events:all;display:flex;align-items:center;gap:10px;max-width:340px}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{to{transform:translateX(120%);opacity:0}}
.toast.out{animation:slideOut .3s ease forwards}
.toast-default{background:var(--g900);color:#fff}
.toast-ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.toast-err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}

/* DASHBOARD */
.dash-pad{padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.dash-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px}
.dash-card h2{font-size:14px;font-weight:700;color:var(--g700);margin-bottom:14px;padding-left:10px;border-left:4px solid var(--blue)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi-card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
.kpi-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kpi-icon{font-size:20px}
.kpi-num{font-size:26px;font-weight:800;line-height:1.1;color:var(--g900)}
.kpi-lbl{font-size:11px;color:var(--g500);font-weight:500}
.status-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.status-chip{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:5px 10px;font-size:12px}
.trend-btns{display:flex;gap:6px;margin-bottom:12px}
.trend-chart-wrap{width:100%;height:220px;position:relative}
.vendor-tbl{width:100%;border-collapse:collapse;font-size:12px}
.vendor-tbl th{background:var(--g50);padding:7px 10px;font-weight:600;color:var(--g700);border-bottom:2px solid var(--g200);text-align:left;white-space:nowrap}
.vendor-tbl td{padding:7px 10px;border-bottom:1px solid var(--g100)}
.vendor-tbl tr:hover td{background:var(--g50)}
.vendor-tbl tr.prob-row td{background:#fff5f5}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;background:var(--g100);color:var(--g700)}
.rank-badge.top3{background:#fef3c7;color:#92400e}
.pr-recv-btn{padding:3px 9px;border-radius:5px;border:1px solid var(--blue);background:var(--blue-l);color:var(--blue);cursor:pointer;font-size:11px;font-weight:600;transition:all .12s}
.pr-recv-btn:hover{background:var(--blue);color:#fff}

/* RECV PR TAB */
.recv-wrap{padding:20px;max-width:700px}
.recv-wrap h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--g900)}
.recv-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.recv-card label{display:block;font-size:12px;font-weight:600;color:var(--g500);margin-bottom:5px}
.recv-card input[type=date],.recv-card input[type=text]{width:100%;padding:8px 12px;border:1.5px solid var(--g200);border-radius:8px;font-size:13px;outline:none;transition:border .15s;background:var(--g50)}
.recv-card input:focus{border-color:var(--blue);background:#fff}
.chip-area{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:6px;border:1.5px dashed var(--g300);border-radius:8px;margin-top:8px;background:var(--g50)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--blue-l);border:1px solid var(--blue);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;color:var(--blue)}
.chip.ok{background:#dcfce7;border-color:#86efac;color:#15803d}
.chip.err{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.chip-remove{cursor:pointer;font-size:14px;line-height:1;color:inherit;opacity:.7}
.chip-remove:hover{opacity:1}
.recv-result{margin-top:12px;padding:12px;border-radius:8px;font-size:12px}
.recv-result.ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.recv-result.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}

/* MISC */
.empty-state{text-align:center;padding:48px 20px;color:var(--g400)}
.empty-state svg{margin-bottom:12px;opacity:.4}
.empty-state p{font-size:14px;font-weight:500}
.page-wrap{padding-bottom:20px}
.section-pad{padding:16px 20px}
.mr-auto{margin-right:auto}
.gap-4{gap:4px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div>
    <h1>📊 PO · PR · Invoice Dashboard</h1>
    <p id="hdrDate"></p>
  </div>
  <div class="hdr-right">
    <button class="btn btn-primary btn-sm" onclick="exportAll()">⬇ Export All (3 Sheets)</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs" id="mainTabs">
  <button class="tab-btn active" onclick="switchTab('dash')" id="tab-dash">📊 Dashboard</button>
  <button class="tab-btn" onclick="switchTab('po')" id="tab-po">📦 PO Report <span class="tab-count" id="cnt-po">…</span></button>
  <button class="tab-btn" onclick="switchTab('pr')" id="tab-pr">📋 PR Report <span class="tab-count" id="cnt-pr">…</span></button>
  <button class="tab-btn" onclick="switchTab('inv')" id="tab-inv">🧾 Invoice <span class="tab-count" id="cnt-inv">…</span></button>
  <button class="tab-btn" onclick="switchTab('recv')" id="tab-recv">📥 รับ PR</button>
</div>

<!-- TAB CONTENTS -->

<!-- DASHBOARD -->
<div class="tab-content active" id="tc-dash">
  <div class="dash-pad" id="dashContent">
    <div class="empty-state"><p>กำลังโหลด Dashboard…</p></div>
  </div>
</div>

<!-- PO REPORT -->
<div class="tab-content" id="tc-po">
  <div class="toolbar" id="tb-po">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="srch-po" placeholder="ค้นหา PO / Vendor / Item…" oninput="onSearch('po')">
    </div>
    <span class="hint" id="hint-po"></span>
    <button class="btn btn-sm" id="btn-filter-po" onclick="toggleColFilter('po')">🔍 Filter คอลัมน์</button>
    <button class="btn btn-sm" id="btn-clearfilter-po" style="display:none" onclick="clearColFilters('po')">✕ ล้าง Filter</button>
    <button class="btn btn-sm" onclick="resetLayout('po')">↺ Reset Layout</button>
    <button class="btn btn-sm" onclick="exportTab('po')">⬇ Export Excel</button>
  </div>
  <div class="page-wrap">
    <div class="tbl-wrap" id="tbl-po" onscroll="onTblScroll(this)"></div>
    <div class="pager" id="pager-po"></div>
  </div>
</div>

<!-- PR REPORT -->
<div class="tab-content" id="tc-pr">
  <div class="toolbar" id="tb-pr">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="srch-pr" placeholder="ค้นหา PR / Item / Vendor…" oninput="onSearch('pr')">
    </div>
    <span class="hint" id="hint-pr"></span>
    <button class="btn btn-sm" id="btn-filter-pr" onclick="toggleColFilter('pr')">🔍 Filter คอลัมน์</button>
    <button class="btn btn-sm" id="btn-clearfilter-pr" style="display:none" onclick="clearColFilters('pr')">✕ ล้าง Filter</button>
    <button class="btn btn-sm" onclick="resetLayout('pr')">↺ Reset Layout</button>
    <button class="btn btn-sm" onclick="exportTab('pr')">⬇ Export Excel</button>
  </div>
  <div class="page-wrap">
    <div class="tbl-wrap" id="tbl-pr" onscroll="onTblScroll(this)"></div>
    <div class="pager" id="pager-pr"></div>
  </div>
</div>

<!-- INVOICE -->
<div class="tab-content" id="tc-inv">
  <div class="toolbar" id="tb-inv">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="srch-inv" placeholder="ค้นหา Invoice / PO / Vendor…" oninput="onSearch('inv')">
    </div>
    <span class="hint" id="hint-inv"></span>
    <button class="btn btn-sm" id="btn-filter-inv" onclick="toggleColFilter('inv')">🔍 Filter คอลัมน์</button>
    <button class="btn btn-sm" id="btn-clearfilter-inv" style="display:none" onclick="clearColFilters('inv')">✕ ล้าง Filter</button>
    <button class="btn btn-sm" onclick="resetLayout('inv')">↺ Reset Layout</button>
    <button class="btn btn-sm" onclick="exportTab('inv')">⬇ Export Excel</button>
  </div>
  <div class="page-wrap">
    <div class="tbl-wrap" id="tbl-inv" onscroll="onTblScroll(this)"></div>
    <div class="pager" id="pager-inv"></div>
  </div>
</div>

<!-- RECV PR -->
<div class="tab-content" id="tc-recv">
  <div class="recv-wrap">
    <h2>📥 บันทึกรับ PR</h2>
    <div class="recv-card">
      <label>วันที่รับ</label>
      <input type="date" id="recv-date">
    </div>
    <div class="recv-card">
      <label>PR Number (กด Enter เพื่อเพิ่ม)</label>
      <input type="text" id="recv-pr-input" placeholder="เช่น PR12345" onkeydown="recvKeydown(event)">
      <div class="chip-area" id="recv-chips"></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-primary" onclick="recvSave()">💾 บันทึก</button>
      <button class="btn" onclick="recvClear()">✕ ล้าง</button>
    </div>
    <div id="recv-result"></div>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer-bg" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawerPanel">
    <div class="drawer-hdr">
      <h3 id="drawerTitle">รายละเอียด</h3>
      <button class="btn btn-sm" id="drawerLinkPO" onclick="drawerGoto('po')" style="display:none">→ PO</button>
      <button class="btn btn-sm" id="drawerLinkPR" onclick="drawerGoto('pr')" style="display:none">→ PR</button>
      <button class="btn btn-sm" id="drawerLinkInv" onclick="drawerGoto('inv')" style="display:none">→ Invoice</button>
      <button class="btn btn-sm" onclick="closeDrawer()">✕ ปิด</button>
    </div>
    <div class="drawer-body" id="drawerBody">
      <p style="color:var(--g400);font-size:13px">กำลังโหลด…</p>
    </div>
  </div>
</div>

<!-- POPUP FILTER (singleton) -->

function skeletonHTML(cols) {

// ===================== FETCH =====================
async function fetchTab(key) {
  if (ST[key].loading) return;
  ST[key].loading = true;
  const s = ST[key];
  const cfg = TABS[key];
  const cols = cfg.displayCols.join(',');
  const from = (s.page - 1) * s.pageSize;
  const to = from + s.pageSize - 1;

  let q = sb.from(cfg.table).select(cols, { count: 'exact' });

  // search
  if (s.search) {
    const tokens = s.search.trim().split(/\s+/).filter(Boolean);
    tokens.forEach(tok => {
      const orParts = cfg.srchCols.map(c => `${c}.ilike.%${tok}%`).join(',');
      q = q.or(orParts);
    });
  }

  // col filters (text input row)
  Object.entries(s.colFilters).forEach(([col, val]) => {
    if (val) q = q.ilike(col, `%${val}%`);
  });

  // popup filters (.in)
  Object.entries(s.popupFilters).forEach(([col, vals]) => {
    if (vals && vals.size > 0) q = q.in(col, [...vals]);
  });

  // sort
  if (s.sortCol) q = q.order(s.sortCol, { ascending: s.sortDir === 'asc' });

  q = q.range(from, to);

  try {
    const { data, error, count } = await q;
    if (error) throw error;
    s.rows = data || [];
    s.total = count || 0;
    renderTab(key);
    document.getElementById('cnt-' + key).textContent = s.total.toLocaleString();
    document.getElementById('hint-' + key).textContent = `${s.total.toLocaleString()} รายการ`;
  } catch(err) {
    toast('โหลดข้อมูลล้มเหลว: ' + err.message, 'err');
  } finally {
    s.loading = false;
  }
}

const BADGE_MAP = {

  PARTIAL_RECEIVED:'amber', PARTIAL_PRICE_MISMATCH:'amber', MEDIUM:'amber', 'IN PROCESS':'amber', Incomplete:'amber',

// ===================== ESCAPE =====================
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===================== PAGER =====================
function renderPager(key) {
  const s = ST[key];
  const totalPages = Math.max(1, Math.ceil(s.total / s.pageSize));
  let html = `<span class="info">หน้า ${s.page}/${totalPages} · ${s.total.toLocaleString()} รายการ</span>`;
  html += `<select class="page-size" onchange="changePageSize('${key}',this.value)">`;
  [25,50,100,200].forEach(n => html += `<option value="${n}" ${s.pageSize===n?'selected':''}>${n}/หน้า</option>`);
  html += '</select>';
  html += `<button class="page-btn" onclick="gotoPage('${key}',1)" ${s.page<=1?'disabled':''}>«</button>`;
  html += `<button class="page-btn" onclick="gotoPage('${key}',${s.page-1})" ${s.page<=1?'disabled':''}>‹</button>`;

  const delta = 2;
  let pages = new Set([1, totalPages]);
  for (let i = Math.max(2, s.page-delta); i <= Math.min(totalPages-1, s.page+delta); i++) pages.add(i);
  let prev = 0;
  [...pages].sort((a,b)=>a-b).forEach(p => {
    if (prev && p - prev > 1) html += `<span style="padding:0 4px;color:var(--g400)">…</span>`;
    html += `<button class="page-btn ${p===s.page?'active':''}" onclick="gotoPage('${key}',${p})">${p}</button>`;
    prev = p;
  });

  html += `<button class="page-btn" onclick="gotoPage('${key}',${s.page+1})" ${s.page>=totalPages?'disabled':''}>›</button>`;
  html += `<button class="page-btn" onclick="gotoPage('${key}',${totalPages})" ${s.page>=totalPages?'disabled':''}>»</button>`;
  document.getElementById('pager-' + key).innerHTML = html;
}

function gotoPage(key, p) {
  const s = ST[key];
  const total = Math.max(1, Math.ceil(s.total / s.pageSize));
  s.page = Math.max(1, Math.min(p, total));
  fetchTab(key);
}

function changePageSize(key, sz) {

  ST[key].page = 1;

}

// ===================== COLUMN RESIZE =====================
let resizeState = null;
function resizeStart(e, key, col) {
  e.stopPropagation(); e.preventDefault();
  const th = e.target.closest('th');
  const startX = e.clientX;
  const startW = th.offsetWidth;
  const handle = e.target;
  handle.classList.add('active');
  resizeState = { key, col, th, startX, startW };
  document.addEventListener('mousemove', resizeMove);
  document.addEventListener('mouseup', resizeEnd);
}
function resizeMove(e) {
  if (!resizeState) return;
  const w = Math.max(60, resizeState.startW + e.clientX - resizeState.startX);
  resizeState.th.style.minWidth = w + 'px';
  resizeState.th.style.width = w + 'px';
  // Update all tds in that column
  const tbl = resizeState.th.closest('table');
  if (tbl) {
    const ci = resizeState.th.cellIndex;
    tbl.querySelectorAll('tbody tr').forEach(tr => {
      if (tr.cells[ci]) { tr.cells[ci].style.minWidth = w+'px'; tr.cells[ci].style.width = w+'px'; }
    });
  }
  ST[resizeState.key].colWidths[resizeState.col] = w;
}
function resizeEnd() {
  if (!resizeState) return;
  saveColWidths(resizeState.key);
  document.querySelectorAll('.resize-handle.active').forEach(h => h.classList.remove('active'));
  document.removeEventListener('mousemove', resizeMove);
  document.removeEventListener('mouseup', resizeEnd);
  resizeState = null;
}

function saveColWidths(key) {
  localStorage.setItem('pw_col_widths_' + key, JSON.stringify(ST[key].colWidths));
}
function loadColWidths(key) {
  try { return JSON.parse(localStorage.getItem('pw_col_widths_' + key)) || {}; } catch { return {}; }
}

// ===================== COLUMN REORDER =====================
let dndSrcKey = null, dndSrcCol = null;
function dndStart(e, key, col) {
  dndSrcKey = key; dndSrcCol = col;
  e.dataTransfer.effectAllowed = 'move';
}
function dndOver(e, key, col) {
  if (dndSrcKey !== key) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.style.background = 'var(--blue-l)';
}
function dndLeave(e) { e.currentTarget.style.background = ''; }
function dndDrop(e, key, col) {
  e.preventDefault(); e.currentTarget.style.background = '';
  if (dndSrcKey !== key || dndSrcCol === col) return;
  const cols = ST[key].displayCols;
  const fromI = cols.indexOf(dndSrcCol);
  const toI = cols.indexOf(col);
  if (fromI < 0 || toI < 0) return;
  cols.splice(fromI, 1);
  cols.splice(toI, 0, dndSrcCol);
  saveColOrder(key);
  renderTab(key);
}

function saveColOrder(key) {
  localStorage.setItem('pw_col_order_' + key, JSON.stringify(ST[key].displayCols));
}
function loadColOrder(key) {
  try {
    const s = localStorage.getItem('pw_col_order_' + key);
    if (s) return JSON.parse(s);
  } catch {}
  return [...TABS[key].displayCols];
}

function resetLayout(key) {
  localStorage.removeItem('pw_col_order_' + key);
  localStorage.removeItem('pw_col_widths_' + key);
  ST[key].displayCols = [...TABS[key].displayCols];
  ST[key].colWidths = {};
  renderTab(key);
  toast('รีเซ็ต Layout แล้ว', 'ok');
}

  if (key === 'po') { poNo = row['PO_NO']; prNo = row['PR_NO']; }
  else if (key === 'pr') { prNo = row['PR Number']; poNo = row['PO Number']; }
  else if (key === 'inv') { poNo = row['PO']; invNo = row['Invoice']; }

  DRAWER.open = true;
  DRAWER.tabKey = key;
  DRAWER.linkPO = poNo;
  DRAWER.linkPR = prNo;
  DRAWER.linkInv = invNo;

  document.getElementById('drawerLinkPO').style.display = poNo ? '' : 'none';
  document.getElementById('drawerLinkPR').style.display = prNo ? '' : 'none';
  document.getElementById('drawerLinkInv').style.display = invNo ? '' : 'none';

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerBody').innerHTML = '<p style="color:var(--g400)">กำลังโหลด…</p>';

  // Fetch related data
  const sections = [];

  if (poNo) {
    const poData = await fetchRelated('PO Report', 'PO_NO', poNo, TABS.po.drawerCols);
    sections.push({ title: '📦 PO Report', cols: TABS.po.drawerCols, data: poData, badgeCols: TABS.po.badgeCols });
  }
  if (prNo) {
    const prData = await fetchRelated('PR Report', 'PR Number', prNo, TABS.pr.drawerCols);
    sections.push({ title: '📋 PR Report', cols: TABS.pr.drawerCols, data: prData, badgeCols: TABS.pr.badgeCols });
  }
  if (poNo || invNo) {
    const invField = 'PO';
    const invVal = poNo;
    const invData = invVal ? await fetchRelated('Report_ReceiveInvoicePOIndirect', invField, invVal, TABS.inv.drawerCols) : [];
    if (invData.length || invNo) {
      sections.push({ title: '🧾 Invoice', cols: TABS.inv.drawerCols, data: invData, badgeCols: TABS.inv.badgeCols });
    }
  }

  let html = '';
  sections.forEach(sec => {
    html += `<div class="drawer-section"><h4>${sec.title} <span class="badge badge-gray">${sec.data.length}</span></h4>`;
    html += '<div style="overflow-x:auto"><table class="drawer-mini-tbl"><thead><tr>';
    sec.cols.forEach(c => html += `<th>${esc(c)}</th>`);
    html += '</tr></thead><tbody>';
    if (!sec.data.length) html += `<tr><td colspan="${sec.cols.length}" style="text-align:center;color:var(--g400);padding:12px">ไม่พบข้อมูล</td></tr>`;
    sec.data.forEach(r => {
      html += '<tr>';
      sec.cols.forEach(c => {
        const v = r[c];
        const cell = sec.badgeCols.includes(c) ? badgeHTML(v) : (v !== null && v !== undefined ? esc(String(v)) : '<span style="color:var(--g400)">—</span>');
        html += `<td>${cell}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  });

  document.getElementById('drawerBody').innerHTML = html || '<p style="color:var(--g400)">ไม่มีข้อมูลเชื่อมโยง</p>';
}

async function fetchRelated(table, col, val, cols) {
  try {
    const { data } = await sb.from(table).select(cols.join(',')).eq(col, val).limit(50);
    return data || [];
  } catch { return []; }
}

function openDrawerByLink(key, col, val) {
  let poNo = null, prNo = null;
  if (key === 'po' && col === 'PO_NO') poNo = val;
  else if (key === 'po' && col === 'PR_NO') prNo = val;
  else if (key === 'pr' && col === 'PR Number') prNo = val;
  else if (key === 'pr' && col === 'PO Number') poNo = val;
  else if (key === 'inv' && col === 'PO') poNo = val;

  const fakeRow = {};
  if (poNo) { fakeRow['PO_NO'] = poNo; fakeRow['PO Number'] = poNo; fakeRow['PO'] = poNo; }
  if (prNo) { fakeRow['PR_NO'] = prNo; fakeRow['PR Number'] = prNo; }
  openDrawer(key, fakeRow);
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  DRAWER.open = false;
}

function drawerGoto(target) {
  closeDrawer();
  let filterKey, filterVal, filterCol;
  if (target === 'po' && DRAWER.linkPO) { filterKey = 'po'; filterCol = 'PO_NO'; filterVal = DRAWER.linkPO; }
  else if (target === 'pr' && DRAWER.linkPR) { filterKey = 'pr'; filterCol = 'PR Number'; filterVal = DRAWER.linkPR; }
  else if (target === 'inv' && DRAWER.linkPO) { filterKey = 'inv'; filterCol = 'PO'; filterVal = DRAWER.linkPO; }
  if (filterKey) {
    switchTab(filterKey);
    setTimeout(() => {
      document.getElementById('srch-' + filterKey).value = filterVal;
      ST[filterKey].search = filterVal;
      ST[filterKey].page = 1;
      fetchTab(filterKey);
    }, 200);
  }
}

// ===================== EXPORT =====================
async function fetchAll(key) {
  const cfg = TABS[key];
  const s = ST[key];
  let allRows = [];
  let page = 1;
  const pageSize = 1000;
  while (true) {
    const from = (page - 1) * pageSize;
    const to = from + pageSize - 1;
    let q = sb.from(cfg.table).select(cfg.displayCols.join(','));
    if (s.search) {
      const tokens = s.search.trim().split(/\s+/).filter(Boolean);
      tokens.forEach(tok => {
        const orParts = cfg.srchCols.map(c => `${c}.ilike.%${tok}%`).join(',');
        q = q.or(orParts);
      });
    }
    Object.entries(s.colFilters).forEach(([col, val]) => { if (val) q = q.ilike(col, `%${val}%`); });
    Object.entries(s.popupFilters).forEach(([col, vals]) => { if (vals && vals.size > 0) q = q.in(col, [...vals]); });
    q = q.range(from, to);
    const { data } = await q;
    if (!data || !data.length) break;
    allRows = allRows.concat(data);
    if (data.length < pageSize) break;
    page++;
    if (page > 50) break; // safety
  }
  return allRows;
}

async function exportTab(key) {
  toast('กำลัง Export…', 'default');
  const rows = await fetchAll(key);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, key.toUpperCase());
  XLSX.writeFile(wb, `${key}_export_${todayISO()}.xlsx`);
  toast('Export สำเร็จ ' + rows.length + ' แถว', 'ok');
}

async function exportAll() {
  toast('กำลัง Export ทุก Sheet…', 'default');
  const wb = XLSX.utils.book_new();
  for (const key of ['po','pr','inv']) {
    if (!ST[key].initialized) {
      ST[key].displayCols = loadColOrder(key);
    }
    const rows = await fetchAll(key);
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, key.toUpperCase());
  }
  XLSX.writeFile(wb, `dashboard_export_${todayISO()}.xlsx`);
  toast('Export สำเร็จ', 'ok');
}

// ===================== TOAST =====================
function toast(msg, type = 'default') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const icons = { default: 'ℹ️', ok: '✅', err: '❌' };
  el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 350);
  }, 3500);
}

// ===================== COUNT-UP ANIMATION =====================
function animCount(el, target, duration = 800) {
  const start = performance.now();
  const update = (now) => {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(ease * target).toLocaleString();
    if (p < 1) requestAnimationFrame(update);
  };
  requestAnimationFrame(update);
}

// ===================== DASHBOARD =====================
async function initDash() {
  await renderDash();
}

async function renderDash() {
  const today = todayISO();
  const dashEl = document.getElementById('dashContent');

  // Render skeleton
  dashEl.innerHTML = `
    <div class="dash-card">
      <h2>📸 OCR วันนี้ (${today})</h2>
      <div style="color:var(--g400);padding:12px 0">กำลังโหลด…</div>
    </div>`;

  // Fetch today's data
  const [todayRes, trendRes7, vendorRes, prRecvRes] = await Promise.all([
    sb.from('Report_ReceiveInvoicePOIndirect').select('Vendor,PO,Invoice,ReceivingStatus,DeliveryTimingStatus').eq('Date Scan', today),
    sb.from('Report_ReceiveInvoicePOIndirect').select('Date Scan,PO,ReceivingStatus').gte('Date Scan', daysAgo(30)).not('Date Scan','is',null).order('Date Scan'),
    sb.from('Report_ReceiveInvoicePOIndirect').select('Vendor,ReceivingStatus,DeliveryTimingStatus'),
    sb.from('PR Report').select('PR Number,Description,Need-By-Date,BU,Department,PO Number').not('PO Number','is',null).neq('PO Number','').is('Receive PR Date',null).limit(300)
  ]);

  const todayRows = todayRes.data || [];
  const trendRows = trendRes7.data || [];
  const vendorRows = vendorRes.data || [];
  const prRecvRows = prRecvRes.data || [];

  // ---- Section A ----
  const distinctPO = new Set(todayRows.map(r=>r['PO']).filter(Boolean)).size;
  const distinctInv = new Set(todayRows.map(r=>r['Invoice']).filter(Boolean)).size;
  const distinctVendor = new Set(todayRows.map(r=>r['Vendor']).filter(Boolean)).size;
  const matchedCount = todayRows.filter(r=>r['ReceivingStatus']==='MATCHED_COMPLETE').length;
  const problemCount = todayRows.filter(r=>r['ReceivingStatus'] && r['ReceivingStatus']!=='MATCHED_COMPLETE').length;
  const lateCount = todayRows.filter(r=>r['DeliveryTimingStatus']==='LATE').length;

  // Status breakdown
  const statusBreakdown = {};
  const deliveryBreakdown = {};
  todayRows.forEach(r => {
    const rs = r['ReceivingStatus'] || '(ว่าง)';
    const dt = r['DeliveryTimingStatus'] || '(ว่าง)';
    statusBreakdown[rs] = (statusBreakdown[rs] || 0) + 1;
    deliveryBreakdown[dt] = (deliveryBreakdown[dt] || 0) + 1;
  });

  // Vendor table today
  const vendorToday = {};
  todayRows.forEach(r => {
    const v = r['Vendor'] || '(ไม่ระบุ)';
    if (!vendorToday[v]) vendorToday[v] = { po: new Set(), inv: new Set(), matched: 0, problem: 0, late: 0 };
    if (r['PO']) vendorToday[v].po.add(r['PO']);
    if (r['Invoice']) vendorToday[v].inv.add(r['Invoice']);
    if (r['ReceivingStatus'] === 'MATCHED_COMPLETE') vendorToday[v].matched++;
    else if (r['ReceivingStatus']) vendorToday[v].problem++;
    if (r['DeliveryTimingStatus'] === 'LATE') vendorToday[v].late++;
  });

  // ---- Section B: Trend ----
  // Group by date
  const trendByDate = {};
  trendRows.forEach(r => {
    const d = r['Date Scan'];
    if (!d) return;
    if (!trendByDate[d]) trendByDate[d] = { date: d, poSet: new Set(), matched: 0, problem: 0 };
    if (r['PO']) trendByDate[d].poSet.add(r['PO']);
    if (r['ReceivingStatus'] === 'MATCHED_COMPLETE') trendByDate[d].matched++;
    else if (r['ReceivingStatus']) trendByDate[d].problem++;
  });

  // ---- Section C: Top Vendors ----
  const vendorAll = {};
  vendorRows.forEach(r => {
    const v = r['Vendor'] || '(ไม่ระบุ)';
    if (!vendorAll[v]) vendorAll[v] = { total: 0, matched: 0, problem: 0, late: 0 };
    vendorAll[v].total++;
    if (r['ReceivingStatus'] === 'MATCHED_COMPLETE') vendorAll[v].matched++;
    else if (r['ReceivingStatus']) vendorAll[v].problem++;
    if (r['DeliveryTimingStatus'] === 'LATE') vendorAll[v].late++;
  });
  const top20Vendors = Object.entries(vendorAll).sort((a,b)=>b[1].total-a[1].total).slice(0,20);

  // Build HTML
  let html = '';

  // Section A
  const kpiCards = [
    { icon:'📦', num: distinctPO, lbl:'PO สแกนวันนี้' },
    { icon:'🧾', num: distinctInv, lbl:'Invoice' },
    { icon:'🏢', num: distinctVendor, lbl:'Vendor' },
    { icon:'✅', num: matchedCount, lbl:'ครบ', color:'var(--green)' },
    { icon:'⚠️', num: problemCount, lbl:'มีปัญหา', color:'var(--amber)' },
    { icon:'⏰', num: lateCount, lbl:'ช้า', color:'var(--red)' }
  ];

  html += `<div class="dash-card">
    <h2>📸 OCR วันนี้ (${today})</h2>
    <div class="kpi-grid" id="kpi-grid">`;
  kpiCards.forEach((k, i) => {
    html += `<div class="kpi-card">
      <div class="kpi-icon">${k.icon}</div>
      <div class="kpi-num" id="kpi-num-${i}" style="${k.color?'color:'+k.color:''}">0</div>
      <div class="kpi-lbl">${k.lbl}</div>
    </div>`;
  });
  html += '</div>';

  // Status breakdown
  html += '<div style="margin-top:14px"><div style="font-size:12px;font-weight:600;color:var(--g500);margin-bottom:8px">ReceivingStatus</div><div class="status-grid">';
  Object.entries(statusBreakdown).sort((a,b)=>b[1]-a[1]).forEach(([st, cnt]) => {
    html += `<div class="status-chip">${badgeHTML(st)} <span style="font-weight:700">${cnt}</span></div>`;
  });
  html += '</div></div>';

  html += '<div style="margin-top:12px"><div style="font-size:12px;font-weight:600;color:var(--g500);margin-bottom:8px">DeliveryTimingStatus</div><div class="status-grid">';
  Object.entries(deliveryBreakdown).sort((a,b)=>b[1]-a[1]).forEach(([st, cnt]) => {
    html += `<div class="status-chip">${badgeHTML(st)} <span style="font-weight:700">${cnt}</span></div>`;
  });
  html += '</div></div>';

  // Vendor table today
  if (Object.keys(vendorToday).length > 0) {
    html += `<div style="margin-top:16px;overflow-x:auto">
      <table class="vendor-tbl">
        <thead><tr><th>Vendor</th><th>PO</th><th>Invoice</th><th>✅ ครบ</th><th>⚠️ ปัญหา</th><th>⏰ ช้า</th></tr></thead>
        <tbody>`;
    Object.entries(vendorToday).sort((a,b)=>b[1].inv.size-a[1].inv.size).forEach(([v, d]) => {
      html += `<tr><td>${esc(v)}</td><td>${d.po.size}</td><td>${d.inv.size}</td><td>${d.matched}</td><td>${d.problem}</td><td>${d.late}</td></tr>`;
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div style="color:var(--g400);font-size:13px;padding:12px 0;text-align:center">ไม่มีข้อมูล OCR วันนี้</div>';
  }
  html += '</div>'; // end Section A

  // Section B: Trend
  html += `<div class="dash-card">
    <h2>📈 แนวโน้ม</h2>
    <div class="trend-btns">
      <button class="btn btn-sm btn-active" onclick="changeTrend(7,this)">7d</button>
      <button class="btn btn-sm" onclick="changeTrend(14,this)">14d</button>
      <button class="btn btn-sm" onclick="changeTrend(30,this)">30d</button>
    </div>
    <div class="trend-chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>`;

  // Section C: Top Vendors
  html += `<div class="dash-card">
    <h2>🏆 Top Vendors (ทั้งหมด)</h2>
    <div style="overflow-x:auto">
      <table class="vendor-tbl">
        <thead><tr><th>Rank</th><th>Vendor</th><th>รวม Invoice</th><th>✅ MATCHED</th><th>⚠️ ปัญหา</th><th>⏰ ช้า</th><th>% ช้า</th></tr></thead>
        <tbody>`;
  top20Vendors.forEach(([v, d], i) => {
    const pct = d.total > 0 ? Math.round(d.late / d.total * 100) : 0;
    const rowCls = pct > 50 ? ' class="prob-row"' : '';
    const rankCls = i < 3 ? ' top3' : '';
    html += `<tr${rowCls}><td><span class="rank-badge${rankCls}">${i+1}</span></td><td>${esc(v)}</td><td>${d.total}</td><td>${d.matched}</td><td>${d.problem}</td><td>${d.late}</td><td>${pct}%</td></tr>`;
  });
  html += '</tbody></table></div></div>';

  // Section D: PR ค้าง
  html += `<div class="dash-card">
    <h2>📥 PR ค้าง/รอรับ (${prRecvRows.length} รายการ)</h2>
    <div style="overflow-x:auto">
      <table class="vendor-tbl">
        <thead><tr><th>PR Number</th><th>Description</th><th>Need-By-Date</th><th>BU</th><th>Department</th><th>PO Number</th><th></th></tr></thead>
        <tbody>`;
  if (prRecvRows.length === 0) {
    html += '<tr><td colspan="7" style="text-align:center;color:var(--g400);padding:16px">ไม่มี PR ค้าง</td></tr>';
  } else {
    prRecvRows.forEach(r => {
      const prNo = r['PR Number'] || '';
      html += `<tr>
        <td><span class="link-text" onclick="gotoReceivePR('${esc(prNo)}')">${esc(prNo)}</span></td>
        <td>${esc(r['Description']||'')}</td>
        <td>${esc(r['Need-By-Date']||'')}</td>
        <td>${esc(r['BU']||'')}</td>
        <td>${esc(r['Department']||'')}</td>
        <td>${esc(r['PO Number']||'')}</td>
        <td><button class="pr-recv-btn" onclick="gotoReceivePR('${esc(prNo)}')">📥 รับ</button></td>
      </tr>`;
    });
  }
  html += '</tbody></table></div></div>';

  dashEl.innerHTML = html;

  // Animate KPI
  [distinctPO, distinctInv, distinctVendor, matchedCount, problemCount, lateCount].forEach((n, i) => {
    const el = document.getElementById('kpi-num-' + i);
    if (el) animCount(el, n);
  });

  // Render trend chart (default 7d)
  renderTrendChart(trendByDate, 7);

  // Store trendByDate globally
  window._trendByDate = trendByDate;
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().split('T')[0];
}

function renderTrendChart(trendByDate, days) {
  const cutoff = daysAgo(days);
  const filtered = Object.entries(trendByDate)
    .filter(([d]) => d >= cutoff)
    .sort((a,b) => a[0].localeCompare(b[0]));

  const labels = filtered.map(([d]) => d);
  const matched = filtered.map(([,v]) => v.matched);
  const problem = filtered.map(([,v]) => v.problem);

  const canvas = document.getElementById('trendChart');
  if (!canvas) return;
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  trendChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: '✅ MATCHED', data: matched, backgroundColor: '#86efac', stack: 'a' },
        { label: '⚠️ ปัญหา', data: problem, backgroundColor: '#fca5a5', stack: 'a' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { stacked: true, beginAtZero: true, ticks: { font: { size: 11 } } }
      }
    }
  });
}

function changeTrend(days, btn) {
  document.querySelectorAll('.trend-btns .btn').forEach(b => b.classList.remove('btn-active'));
  btn.classList.add('btn-active');
  if (window._trendByDate) renderTrendChart(window._trendByDate, days);
}

// ===================== RECEIVE PR =====================
const recvPRList = [];

function recvKeydown(e) {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    if (val) {
      addRecvPR(val);
      e.target.value = '';
    }
  }
}

function addRecvPR(prNo) {
  if (!recvPRList.includes(prNo)) {
    recvPRList.push(prNo);
    renderRecvChips();
  }
}

function renderRecvChips() {
  const area = document.getElementById('recv-chips');
  area.innerHTML = recvPRList.map((pr, i) =>
    `<span class="chip" id="chip-${i}">${esc(pr)} <span class="chip-remove" onclick="removeRecvPR(${i})">×</span></span>`
  ).join('');
}

function removeRecvPR(i) {
  recvPRList.splice(i, 1);
  renderRecvChips();
}

function recvClear() {
  recvPRList.length = 0;
  renderRecvChips();
  document.getElementById('recv-pr-input').value = '';
  document.getElementById('recv-result').innerHTML = '';
}

async function recvSave() {
  if (!recvPRList.length) { toast('กรุณาเพิ่ม PR Number อย่างน้อย 1 รายการ', 'err'); return; }
  const dateVal = document.getElementById('recv-date').value;
  if (!dateVal) { toast('กรุณาเลือกวันที่', 'err'); return; }

  const results = [];
  for (const prNo of recvPRList) {
    // Validate exists
    const { data: existing } = await sb.from('PR Report').select('PR Number').eq('PR Number', prNo).limit(1);
    if (!existing || !existing.length) {
      results.push({ pr: prNo, ok: false, msg: 'ไม่พบ PR ในระบบ' });
      continue;
    }
    const { error } = await sb.from('PR Report').update({ 'Receive PR Date': dateVal }).eq('PR Number', prNo);
    if (error) results.push({ pr: prNo, ok: false, msg: error.message });
    else results.push({ pr: prNo, ok: true, msg: 'บันทึกสำเร็จ' });
  }

  // Update chips display
  recvPRList.forEach((pr, i) => {
    const chip = document.getElementById('chip-' + i);
    if (!chip) return;
    const res = results.find(r => r.pr === pr);
    if (res) chip.className = 'chip ' + (res.ok ? 'ok' : 'err');
  });

  const ok = results.filter(r=>r.ok).length;
  const fail = results.filter(r=>!r.ok).length;
  const resEl = document.getElementById('recv-result');
  resEl.className = 'recv-result ' + (fail === 0 ? 'ok' : 'err');
  resEl.innerHTML = results.map(r =>
    `<div>${r.ok ? '✅' : '❌'} ${esc(r.pr)}: ${esc(r.msg)}</div>`
  ).join('');

  toast(`บันทึกสำเร็จ ${ok} รายการ${fail>0?' (ล้มเหลว '+fail+' รายการ)':''}`, fail===0?'ok':'err');
}

function gotoReceivePR(prNo) {
  switchTab('recv');
  if (!recvPRList.includes(prNo)) {
    addRecvPR(prNo);
  }
  document.getElementById('recv-pr-input').focus();
  toast('เพิ่ม PR ' + prNo + ' แล้ว', 'ok');
}
